name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "codecov.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # id-token: write lets the Codecov steps sign in with a short-lived OIDC
    # token instead of a stored upload token. It is granted to this job only,
    # so a job added to this workflow later does not inherit it. A job-level
    # block replaces the workflow-level one, so contents: read is restated.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Atlas requires Node 22 or later; one cell is enough, so the check runs
      # on the Node 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.17.0 check

      - run: pnpm install

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The reporter flags reach every package's vitest run through pnpm, so
      # each package writes its own junit.xml next to its coverage report.
      - name: Test with coverage
        id: test
        run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Dependency vulnerability scan
        if: matrix.node-version == 22
        # Fail the build on any high/critical advisory in PRODUCTION deps (the
        # shipped artifact). Dev-only test-tooling advisories (e.g. vitest's
        # transitive minimatch/rollup) do not ship and must not block CI.
        # Tolerate registry/network outages so a flaky endpoint can't block CI.
        run: |
          set +e
          audit_out="$(pnpm audit --prod --audit-level=high 2>&1)"
          status=$?
          echo "$audit_out"
          if [ "$status" -eq 0 ]; then
            echo "No high or critical vulnerabilities found."
            exit 0
          fi
          if echo "$audit_out" | grep -qiE 'vulnerabilit'; then
            echo "::error::High or critical dependency vulnerabilities detected."
            exit 1
          fi
          echo "::warning::pnpm audit could not reach the advisory registry; treating as non-blocking."
          exit 0

      - name: Run benchmarks
        if: matrix.node-version == 22
        run: pnpm bench

      # Both uploads sign in with OIDC and fail the job when Codecov refuses
      # the report, so a broken upload can no longer pass unseen. Coverage
      # stays in Vitest's JSON form: each package runs Vitest from its own
      # directory, which makes lcov paths package-relative (src/index.ts in
      # every package), while the JSON report carries full paths that Codecov
      # places in the right package. Test results go up whenever the tests
      # ran, failures included, because a failing test is what that report
      # exists to show.
      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./packages/*/coverage/coverage-final.json
          flags: unit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == 22 && steps.test.outcome != 'skipped' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./packages/*/junit.xml
          flags: unit
