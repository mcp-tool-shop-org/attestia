name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "codecov.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    env:
      # 'true' on the one cell whose coverage and test results go to Codecov:
      # Node 22, on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.node-version == 22 && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Atlas requires Node 22 or later; one cell is enough, so the check runs
      # on the Node 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.17.0 check

      - run: pnpm install

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The reporter flags reach every package's vitest run through pnpm, so
      # each package writes its own junit.xml next to its coverage report.
      - name: Test with coverage
        id: test
        run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=junit.xml

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # files to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: packages/*/junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Dependency vulnerability scan
        if: matrix.node-version == 22
        # Fail the build on any high/critical advisory in PRODUCTION deps (the
        # shipped artifact). Dev-only test-tooling advisories (e.g. vitest's
        # transitive minimatch/rollup) do not ship and must not block CI.
        # Tolerate registry/network outages so a flaky endpoint can't block CI.
        run: |
          set +e
          audit_out="$(pnpm audit --prod --audit-level=high 2>&1)"
          status=$?
          echo "$audit_out"
          if [ "$status" -eq 0 ]; then
            echo "No high or critical vulnerabilities found."
            exit 0
          fi
          if echo "$audit_out" | grep -qiE 'vulnerabilit'; then
            echo "::error::High or critical dependency vulnerabilities detected."
            exit 1
          fi
          echo "::warning::pnpm audit could not reach the advisory registry; treating as non-blocking."
          exit 0

      - name: Run benchmarks
        if: matrix.node-version == 22
        run: pnpm bench

  codecov:
    # Uploads what build-and-test saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever build-and-test ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result != 'cancelled' && needs.build-and-test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Both artifacts unpack into packages/, where build-and-test wrote
      # them. A pattern that matches nothing, unlike a name, does not fail: a
      # failing test run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: packages

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: packages

      # Coverage stays in Vitest's JSON form: each package runs Vitest from
      # its own directory, which makes lcov paths package-relative
      # (src/index.ts in every package), while the JSON report carries full
      # paths that Codecov places in the right package. After a passing
      # build-and-test both artifacts exist, so each upload runs, and fails
      # the job if its files are missing; after a failing one each runs when
      # its files arrived. Both sign in with OIDC, fail the job when Codecov
      # refuses the report, and run the Codecov CLI at a fixed version rather
      # than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.build-and-test.result == 'success' || hashFiles('packages/*/coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./packages/*/coverage/coverage-final.json
          flags: unit

      - name: Upload test results to Codecov
        if: ${{ needs.build-and-test.result == 'success' || hashFiles('packages/*/junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./packages/*/junit.xml
          flags: unit
